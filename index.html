  <!-- Pure cipher core preserved for backwards compatibility and node test_core runner -->
  <script>
/* CORE:START */
// Pure cipher logic. No DOM access here, so it can be unit-tested in node.
function mod26(n) { return ((n % 26) + 26) % 26; }

function parseShift(raw) {
  const n = parseInt(String(raw).trim(), 10);
  if (!Number.isFinite(n)) return { error: 'Shift must be a whole number.' };
  return { value: mod26(n) };
}

function parseKeyword(raw) {
  const letters = String(raw || '').toUpperCase().replace(/[^A-Z]/g, '');
  if (!letters) return { error: 'Keyword needs at least one letter A-Z.' };
  return { value: letters };
}

// Returns { steps, output, error }. Each step: { input, output, isLetter, detail }.
// cipher: 'caesar' | 'vigenere'. keyRaw: shift number or keyword. decrypt: boolean.
function buildSteps(text, cipher, keyRaw, decrypt) {
  const key = cipher === 'caesar' ? parseShift(keyRaw) : parseKeyword(keyRaw);
  if (key.error) return { steps: [], output: '', error: key.error };

  const kw = cipher === 'vigenere' ? key.value : null;
  const steps = [];
  let keyPos = 0; // advances only on letters

  for (const ch of String(text)) {
    const isAlpha = /^[A-Za-z]$/.test(ch);
    if (!isAlpha) {
      steps.push({ input: ch, output: ch, isLetter: false, detail: 'not a letter, passed through unchanged' });
      continue;
    }
    const upper = ch.toUpperCase();
    const p = upper.charCodeAt(0) - 65; // input letter index 0..25
    let c, detail;

    if (cipher === 'caesar') {
      const s = key.value;
      if (!decrypt) {
        const sum = p + s;
        c = mod26(sum);
        detail = `${upper} = ${p}, + shift ${s} = ${sum}, mod 26 = ${c} (${String.fromCharCode(65 + c)})`;
      } else {
        const diff = p - s;
        c = mod26(diff);
        detail = `${upper} = ${p}, - shift ${s} = ${diff}, mod 26 = ${c} (${String.fromCharCode(65 + c)})`;
      }
    } else {
      const kch = kw[keyPos % kw.length];
      const k = kch.charCodeAt(0) - 65;
      if (!decrypt) {
        const sum = p + k;
        c = mod26(sum);
        detail = `${upper} = ${p}, key ${kch} = ${k}, ${p} + ${k} = ${sum}, mod 26 = ${c} (${String.fromCharCode(65 + c)})`;
      } else {
        const diff = p - k;
        c = mod26(diff);
        detail = `${upper} = ${p}, key ${kch} = ${k}, ${p} - ${k} = ${diff}, mod 26 = ${c} (${String.fromCharCode(65 + c)})`;
      }
      keyPos++;
    }

    const outCh = String.fromCharCode(65 + c);
    const out = ch === ch.toLowerCase() ? outCh.toLowerCase() : outCh;
    steps.push({ input: ch, output: out, isLetter: true, detail });
  }

  return { steps, output: steps.map(s => s.output).join(''), error: null };
}

function caesarEncrypt(text, shift) { return buildSteps(text, 'caesar', shift, false).output; }
function caesarDecrypt(text, shift) { return buildSteps(text, 'caesar', shift, true).output; }
function vigenereEncrypt(text, kw) { return buildSteps(text, 'vigenere', kw, false).output; }
function vigenereDecrypt(text, kw) { return buildSteps(text, 'vigenere', kw, true).output; }
/* CORE:END */
  </script>
